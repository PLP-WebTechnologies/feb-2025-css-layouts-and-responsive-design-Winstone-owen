<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Web Design Practice</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <section class="sectionbar">
    <ul class="section-menu">
      <li><a href="#">Home</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Media</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </section>

  <!-- Hero Section -->
  <header class="hero">
    <h1>Welcome to My Responsive Page</h1>
    <p>This is a practice page using Flexbox and Grid</p>
  </header>

  <!-- Main Content Section -->
  <main class="main-content">

    <!-- Image Grid -->
    <section class="gallery-grid">
      <h2>Image Gallery</h2>
      <div class="grid-container">
        <img src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 1" />
        <img src="https://images.pexels.com/photos/9020780/pexels-photo-9020780.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 2" />
        <img src="https://images.pexels.com/photos/4656621/pexels-photo-4656621.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 3" />
        <img src="https://images.pexels.com/photos/9544279/pexels-photo-9544279.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 4" />
        <img src="https://images.pexels.com/photos/1383834/pexels-photo-1383834.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 5" />
        <img src="https://images.pexels.com/photos/27867773/pexels-photo-27867773/free-photo-of-ford-mustang-gt-2015-red.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Placeholder 6" />
      </div>
    </section>

    <!-- Media Section -->
    <section class="video-section">
      <h2>Watch This Video</h2>
      <video controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </section>

    <!-- Info Section -->
    <section class="info-section">
      <h2>About This Page</h2>
      <p>This page is built using HTML to practice  responsive web design using media queries.</p>
    </section>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Responsive Practice Page</p>
  </footer>

</body>
</html>
